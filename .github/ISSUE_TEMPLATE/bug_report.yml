name: 🐛 Bug Report
description: File a bug report to help us fix an issue in 30 MINUTE
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report! Please provide as much detail as possible.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A concise summary of the issue
      placeholder: e.g. Timer displays NaN after restoring backup from Chrome
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Clear steps explaining how to trigger the bug
      placeholder: |
        1. Open /challenges
        2. Filter by "Indian Tech"
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and Node version (if running locally)
      placeholder: e.g. Safari 17 on macOS Sonoma / Node 22
